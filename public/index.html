<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TakaBazar - Universal Gaming Platform</title>
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="logo">Taka<span>Bazar</span></div>
    <div class="user-nav">
      <div class="wallet-badge">
        <span class="label">Balance:</span>
        <span class="currency">৳</span>
        <strong id="walletBalance">0.00</strong>
      </div>
      <button class="btn-deposit" onclick="openDepositModal()">Deposit</button>
      <button class="btn-admin" onclick="openAdminModal()">Admin PIN</button>
    </div>
  </header>

  <!-- Main Platform Container -->
  <main class="main-layout">

    <!-- Homepage View: Banner & Game Lobby -->
    <section id="lobbyView" class="view-section">
      <div class="hero-banner">
        <h2>Win Big Today on TakaBazar!</h2>
        <p>Play Live Crash, Slots, and Arcade Games instantly with Seamless Wallet Sync.</p>
      </div>

      <div class="category-bar">
        <button class="cat-btn active">All Games</button>
        <button class="cat-btn">Crash Games</button>
        <button class="cat-btn">Slot Machine</button>
      </div>

      <div class="game-grid" id="gameGrid">
        <!-- Built-in Demo Crash Game Card -->
        <div class="game-card" onclick="startCrashGame()">
          <div class="card-thumb crash-thumb">🚀</div>
          <div class="card-info">
            <h4>Live SkyRush Crash</h4>
            <p>Multiplayer Live Engine</p>
            <button class="play-btn">Play Now</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Game View: Active Game Screen -->
    <section id="gameScreenView" class="view-section hidden">
      <div class="game-header">
        <button class="back-btn" onclick="showLobby()">← Back to Lobby</button>
        <h3 id="activeGameTitle">Playing Game</h3>
      </div>
      
      <!-- Built-in Crash Game Interactive Screen -->
      <div id="builtInCrashScreen" class="crash-arena hidden">
        <div class="crash-stage">
          <div class="multiplier-val" id="liveMultiplier">1.00x</div>
          <div class="status-val" id="liveStatus">WAITING FOR NEXT ROUND...</div>
        </div>
        <div class="crash-controls">
          <input type="number" id="betAmount" placeholder="Bet Amount (৳)" value="10">
          <button id="placeBetBtn" class="btn-bet" onclick="placeBet()">Place Bet</button>
          <button id="cashoutBtn" class="btn-cashout hidden" onclick="cashout()">Cash Out</button>
        </div>
      </div>

      <!-- External ZIP Game Frame Container -->
      <div id="iframeContainer" class="iframe-box hidden"></div>
    </section>

  </main>

  <!-- Admin Control Modal -->
  <div id="adminModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" onclick="closeAdminModal()">&times;</span>
      <h3>Admin Control Panel</h3>
      <div id="adminLoginForm">
        <input type="password" id="adminPinInput" placeholder="Enter Admin PIN (Default: 6123)">
        <button onclick="loginAdmin()">Login</button>
      </div>
      <div id="adminControls" class="hidden">
        <p class="admin-status">Status: Authenticated</p>
        <div class="control-group">
          <label>Force Crash Multiplier:</label>
          <input type="number" id="targetMultiplier" placeholder="e.g. 1.20" step="0.1">
          <button class="btn-danger" onclick="triggerForceCrash()">Trigger Force Crash Now</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/sdk/takabazar-auto-bridge.js"></script>
  <script src="/app.js"></script>
</body>
</html>
